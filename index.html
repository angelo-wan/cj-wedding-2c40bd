<script type="application/json" id="data">{"meta": {"title": "Calvin & Jolene MC Script", "date": "Sat 28 Nov 2026", "venue": "The Outset, Singapore", "doors": "Guests arrive 6:40pm, cocktail hour from 7pm", "team": "Angelo + Jas (emcees), Angelo + Tyrick (games and hype, the sheet calls Angelo Angie), Jane (CueMaster), Ilham (AV)", "updated": ""}, "rules": ["End every bit with the next person's name. Say the name, then pass the mic.", "Don't talk over a video or a march-in. Wait for the last frame or the couple reaching the front.", "If you lose your place, turn to your partner and ask \"Jas, what's next?\" It sounds like banter.", "Look at Jane before you start a cue line. Her nod means the AV is ready."], "bridges": [["Running late, filling time", "Take this chance to top up your drinks. We'll be right back with you in a minute."], ["Video won't start", "Looks like the screen needs a moment. Good time to grab another drink. (Then look at Jane and Ilham.)"], ["Couple not ready", "Our couple is just getting ready. Give them one more minute, and make sure you're seated for a good view."], ["Speaker slow to come up", "Let's bring them up with a big round of applause!"], ["Room too loud", "Can I have everyone's attention for a moment, please? Thank you!"], ["You lost your place", "Jas, what's next?"], ["You jumped a cue", "Okay, small change of plan. Here's what's happening next..."], ["Mic dies", "Grab your partner's mic: Alright, we're back!"], ["Game running long", "Alright, last round!"], ["Food still going out during a bit", "Please keep eating, just keep an ear out for us."], ["Stragglers still standing", "Last call, everyone! Please take your seats, we're about to start."], ["Passing the mic", "Over to you, Jas. / Back to you, Angelo."]], "names": {"Angelo": "Angelo", "Jas": "Jas", "AT": "Angelo & Tyrick", "Angie": "Angelo", "Couple": "Couple", "DO": "Do", "JA": "Jas or Angelo"}, "rows": [{"id": "r1600", "time": "4:00pm", "title": "Meet at The Outset", "mc": fa still standing."]], "handoff": ["DO", "", ""]}, {"id": "s3", "time": "7:30pm", "title": "Guests seated, welcome", "cue": "Q3", "audio": "0% (off)", "lights": "Spotlight only", "uplight": "Warm", "slides": "Monogram", "food": "Appetiser served", "couple": "Calvin to come out after 'please be seated'", "crew": "Jeremy to check & report on DIY bar level. Yong Qi to keep money box in bridal room", "mc": true, "watch": "Most guests seated, appetiser going out.", "lines": [["JA", "Please be seated as the program is starting."], ["DO", "From the sheet. Calvin comes out after this line."], ["Jas", "Good evening ladies and gentleman. Welcome to the wedding of Calvin and Jolene. It is lovely to see families and friends gathered here today to celebrate the couple."], ["Jas", "For those who don't know me, I'm Jaslyn, the bride's elder sister and I will be your emcee for tonight together with their very good friend, doo doo doo doo Steve. I mean, Angie."], ["Angelo", "That's me! We're very happy to be your emcees for tonight."], ["Angelo", "Looking around the room, it's clear that Calvin and Jolene are surrounded by people who have been part of many different chapters of their lives."], ["Angelo", "We know some of you have flown in specially to be here, so thank you for making the journey from xx and xx, and celebrating this very special day with them."], ["Angelo", "Aside from it being the couple's special day, they also want to celebrate you, and they've programmed the wedding such that YOU have fun!"]], "check": "The doc still says \"from xx and xx\". Fill in where the overseas guests flew in from.", "handoff": ["DO", "", ""]}, {"id": "s4", "time": "7:35pm", "title": "Part 1: Bride video", "cue": "Q4", "audio": "80%", "track": "From video", "lights": "Switch off all lights", "uplight": "Warm", "slides": "Bride video", "couple": "Calvin standby at the discoball. Jolene to standby at the back of aisle", "crew": "JY to accompany Jolene", "photo": "Groom reaction. Audience reacti photo of bride & groom with family (1 for groom side, 1 for bride side)", "mc": true, "lines": [["Jas", "You guys are good sports! It's no wonder you're friends with the couple AND invited to their wedding."], ["Jas", "The soup is now being served and as you're enjoying the next course, the couple will be taking photos with their family."], ["DO", "Invite the family to come up?"]], "go": "Shots Cam track ends", "handoff": ["DO", "", ""]}, {"id": "s10", "time": "8:20pm", "title": "Speech 1: Jane and Jack", "cue": "Q11", "audio": "0% (off)", "lights": "Stage zigzag only", "uplight": "Warm", "slides": "Monogram", "photo": "Photo of persons giving speech", "mc": true, "lines": [["Jas", "\u003cclings glass> It's not a wedding without sentimental words from their closest. May we invite Jane (mine and Jolene's youngest sister) and Jack (Calvin's best friend?)."]], "check": "The sheet has two Q11s: soup at 8:10 and this speech at 8:20. Jane, confirm the numbering.", "speech": "Jane, Jack", "handoff": ["DO", "", ""]}, {"id": "s11", "time": "8:25pm", "title": "Game 1: Jollibee Awards", "cue": "Q12", "audio": "50%", "track": "Star Awards Opening.mp3", "lights": "Spotlight only", "uplight": "Warm", "slides": "Awards slide (Only after first award category is mentioned)", "crew": "Yong Qi to check & report on DIY bar level. Jeremy, Jack and YW to standby cameras. Ilham to standby at AV booth", "photo": "Photo of game emcees. Photo of participants. Crowd reaction. Screen", "mc": true, "lines": [["AT", "Alright, we'd now like to give a special shout-out to some of our guests here tonight."], ["AT", "Presenting... the first and only Jollibee Awards!"], ["AT", "First award, the OG Award. The nominees are: Jane, Zavier and Shaqil. And the winner is... Jane!"], ["AT", "Second, the Lightning McQueen Award, for the fastest to RSVP. The nominees are: Amanda, Wendy and Clarissa. And the winner is... Amanda!"], ["AT", "And lastly, the Lord of the Ring Award, for the guest who travelled the function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function mentions(text, n) { return !!text && new RegExp("\\b" + esc(n) + "\\b").test(text); }
function sentences(t) { return (t || "").split(/\.\s+/).map(function (x) { return x.replace(/\.$/, "").trim(); }).filter(Boolean); }
function mins(t) { var m = /^(\d{1,2}):(\d{2})\s*(am|pm)?/i.exec(t || ""); if (!m) return null; var h = +m[1] % 12; if ((m[3] || "").toLowerCase() === "pm") h += 12; return h * 60 + +m[2]; }

function rowsFor(v) { return v === "mc" ? DATA.rows.filter(function (r) { return r.mc; }) : v === "p" ? DATA.rows.filter(function (r) { return involved(r, param); }) : DATA.rows; }
function hasAV(r) { return !!(r.cue || r.audio || r.track || r.lights || r.slides); }

/* What one person does in one row */
function partFor(r, p) {
  var out = { lines: [], tasks: [], speech: false, av: false, uplight: "", photo: "" };
  splitNames(r.speech).forEach(function (n) { if (canon(n) === p) out.speech = true; });
  var keys = SPEAKS[p] || [];
  (r.lines || []).forEach(function (l) { if (keys.indexOf(l[0]) >= 0) { if (!(out.speech && l[0] === "Couple")) out.lines.push(l); } else if (l[0] === "DO" && mentions(l[1], p)) out.tasks.push(l[1]); });
  var couple = p === "Calvin" || p === "Jolene";
  ["couple", "crew", "check", "go"].forEach(function (f) {
    sentences(r[f]).forEach(function (s) {
      if (mentions(s, p)) out.tasks.push(f === "go" ? "AV cue goes on: " + s : s);
      else if (couple && f === "couple" && !mentions(s, "Calvin") && !mentions(s, "Jolene")) out.tasks.push(s);
    });
  });
  if ((p === "Jane" || p === "Ilham") && hasAV(r)) out.av = true;
  if (p === "Leanne" && r.uplight) out.uplight = r.uplight;
  if (p === "Photographers" && r.photo) out.photo = r.photo;
  if (splitNames(r.people).map(canon).indexOf(p) >= 0 && !out.tasks.length && !out.lines.length && !out.speech) out.tasks.push("You're needed for this one.");
  return out;
}
function involved(r, p) { var x = partFor(r, p); return x.speech || x.av || x.lines.length || x.tasks.length || x.uplight || x.photo; }
function rolesFor(p) {
  var out = [], mates = [];
  DATA.roles.forEach(function (ph) { ph.groups.forEach(function (g) { g.items.forEach(function (it) {
    var ns = splitNames(it[1]).map(canon);
    if (ns.indexOf(p) >= 0) { out.push([ph.phase + (ph.time ? " (" + ph.time + ")" : ""), it[0], it[1]]); ns.forEach(function (n) { if (n !== p && mates.indexOf(n) < 0) mates.push(n); }); }
  }); }); });
  return { roles: out, mates: mates };
}

    var g = function (k) { var i = f.querySelector("#f-" + k); return i ? i.value.trim() : ""; };
    var n = { id: r.id, time: g("time"), title: g("title") || "Untitled", cue: g("cue"), mc: cb.checked, watch: g("watch"),
      lines: textToLines(f.querySelector("#f-lines").value), handoff: [sel.value, g("hlast"), g("hnext")], speech: g("speech"), people: g("people"), check: g("check"), go: g("go") };
    AVF.forEach(function (x) { n[x[0]] = g(x[0]); });
    Object.keys(n).forEach(function (k) { if (n[k] === "" && k !== "id") delete n[k]; });
    commit(DATA.rows.map(function (x) { return x.id === r.id ? n : x; }));
  });
  return f;
}
function move(id, d) { var rows = DATA.rows.slice(), i = rows.findIndex(function (x) { return x.id === id; }), j = i + d; if (j < 0 || j >= rows.length) return; var t = rows[i]; rows[i] = rows[j]; rows[j] = t; commit(rows); }
function addAfter(id) { var rows = DATA.rows.slice(), i = rows.findIndex(function (x) { return x.id === id; }); rows.splice(i + 1, 0, { id: "r" + Date.now().toString(36), time: "", title: "New row", mc: route === "mc", lines: [], handoff: ["DO", "", ""] }); commit(rows); }

var SKEL = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
var HEADBITS = '\n<title>Calvin &amp; Jolene Wedding Night</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">\n';
var SC = "scr" + "ipt";
function buildDoc(data) {
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  return SKEL + HEADBITS + '<style id="st">' + document.getElementById("st").textContent + "</style>\n" +
    "<" + SC + ' type="application/json" id="data">' + json + "</" + SC + ">\n" +
    "<" + SC + ' id="app">' + document.getElementById("app").textContent + "</" + SC + ">\n</body></html>";
}
function commit(rows) {
  if (busy || !art) return;
  busy = true; say("Saving...");
  var next = JSON.parse(JSON.stringify(DATA)); next.rows = rows; next.meta.updated = new Date().toISOString();
  try { sessionStorage.setItem("cj-route-after", location.hash || "#show"); } catch (e) {}
  art.publish(buildDoc(next)).then(function () { say("Saved. Everyone with the link gets this version."); busy = false; })
    .catch(function (e) {
      busy = false; var c = e && e.code;
      if (c === "conflict") say("Someone saved a newer version just now. The page is reloading to it, so redo your change after.");
      else if (c === "not_writer" || c === "not_granted") { canEdit = false; editMode = false; editing = null; render(); say("This view is read-only."); }
      else if (c === "rate_limited") say("Too many saves in a row. Wait a few seconds and save again.");
      else say("Didn't save (" + (c || "error") + "). Try again.");
    });
}

/* Ticks, next bar, clock */
function nextRow() { if (["mc", "show", "p"].indexOf(route) < 0) return null; var rs = rowsFor(route), d = done(); for (var i = 0; i < rs.length; i++) if (!d[rs[i].id]) return rs[i]; return null; }
function scrollToRow(id) { var c = document.getElementById("row-" + id); if (c) c.scrollIntoView({ block: "start" }); }
function toggle(id) {
  var d = done(); if (d[id]) delete d[id]; else d[id] = 1;
  save(doneKey(), d); render();
  if (d[id]) { var n = nextRow(); if (n) scrollToRow(n.id); }
}
function nowRowId() {
  try {
    var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Singapore", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
    if (o.year + "-" + o.month + "-" + o.day !== "2026-11-28") return null;
    var now = +o.hour * 60 + +o.minute, id = null;
    DATA.rows.forEach(function (r) { var m = mins(r.time); if (m != null && m <= now) id = r.id; });
    return id;
  } catch (e) { return null; }
}
function updateBar() {
  var showBar = ["mc", "show", "p"].indexOf(route) >= 0; bar.hidden = !showBar; if (!showBar) return;
  var nx = nextRow(); nbT.textContent = "";
  if (nx) {
    nbT.appendChild(el("span", "t", nx.cue || "No Q")); nbT.appendChild(document.createTextNode(nx.title + (nx.time ? " · ~" + nx.time : "")));
    if (route === "mc") { var f = (nx.lines || []).filter(function (l) { return l[0] !== "DO"; })[0]; nbW.textContent = (f ? name(f[0]) + " starts" : "Nobody speaks") + (nx.watch ? " · " + nx.watch : ""); }
    else if (route === "p") { var pt = partFor(nx, param); nbW.textContent = pt.speech ? "Your speech" : pt.lines.length ? "You say: " + pt.lines[0][1] : pt.tasks[0] || (nx.go ? "Go on: " + nx.go : ""); }
    else nbW.textContent = nx.go ? "Go on: " + nx.go : (nx.audio || nx.slides || "");
    nbDone.hidden = false;
  } else { nbT.textContent = "All done. Enjoy the party."; nbW.textContent = ""; nbDone.hidden = true; }
}
goBtn.onclick = function () { var n = nextRow(); if (n) scrollToRow(n.id); };
nbDone.onclick = function () { var n = nextRow(); if (n) toggle(n.id); };

function render() {
  root.textContent = "";
  header();
  if (route === "home") pageHome();
  else if (route === "p") pagePerson();
  else if (route === "roles") pageRoles();
  else if (route === "seating") pageSeating();
  else if (route === "awards") pageAwards();
  else if (route === "setup") pageSetup();
  else if (route === "packing") pagePacking();
  else if (route === "checkin") pageCheckin();
  else pageRows();
  updateBar();
}

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); save("cj-size", size); }
var lock = null, wantWake = false;
function wakeOn() {
  if (!navigator.wakeLock) { wakeBtn.textContent = "Set auto-lock to Never"; return; }
  navigator.wakeLock.request("screen").then(function (l) {
    lock = l; wakeBtn.setAttribute("aria-pressed", "true"); wakeBtn.textContent = "Screen stays on";
    l.addEventListener("release", function () { wakeBtn.setAttribute("aria-pressed", "false"); wakeBtn.textContent = "Keep screen on"; });
  }).catch(function () { wakeBtn.textContent = "Set auto-lock to Never"; });
}
wakeBtn.onclick = function () { if (lock && !lock.released) { wantWake = false; lock.release(); lock = null; } else { wantWake = true; wakeOn(); } };
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && wantWake) wakeOn(); });

function readRoute() {
  var h = (location.hash || "").replace(/^#/, "");
  if (!h) { var after = null; try { after = sessionStorage.getItem("cj-route-after"); sessionStorage.removeItem("cj-route-after"); } catch (e) {} if (after) h = after.replace(/^#/, ""); }
  var parts = h.split("/"); route = parts[0] || "home"; param = parts[1] ? decodeURIComponent(parts[1]) : ""; target = "";
  if (route === "show" || route === "mc") { target = param; param = ""; }
  if (["home", "p", "show", "mc", "roles", "seating", "awards", "setup", "packing", "checkin"].indexOf(route) < 0) route = "home";
}
function go() {
  readRoute(); editing = null; render();
  if (target) setTimeout(function () { scrollToRow(target); }, 0); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);
applySize(); go();

if (window.claude && window.claude.use) {
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (res) {
    art = res[0]; var user = res[1];
    if (!art || !user) return;
    return user.canEdit().then(function (ok) { if (ok) { canEdit = true; render(); } });
  }).catch(function () {});
}
})();
</script>
